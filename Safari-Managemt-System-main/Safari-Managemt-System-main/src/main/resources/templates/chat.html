<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-paw me-2"></i>SAFARI WILD</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 overflow-hidden">

                <div class="card-header card-header-safari d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 text-white">
                        <i class="far fa-comments me-2"></i>Chat with <span class="fw-bold text-warning" th:text="${receiverName}"></span>
                    </h5>

                    <div>
                        <a th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}"
                           href="/admin/tourists" class="btn btn-sm btn-outline-light rounded-pill px-3">Back to List</a>
                        <a th:if="${#authorization.expression('hasAuthority(''TOURIST'')')}"
                           href="/" class="btn btn-sm btn-outline-light rounded-pill px-3">Back Home</a>
                    </div>
                </div>

                <div class="card-body p-0">

                    <div class="chat-box chat-container p-4" style="height: 500px; overflow-y: auto;">
                        <div th:each="msg : ${messages}" class="d-flex w-100 mb-3">

                            <div th:class="${msg.sender.username == #authentication.name} ? 'ms-auto' : 'me-auto'" style="max-width: 75%;">

                                <div th:class="'message-bubble ' + (${msg.sender.username == #authentication.name} ? 'msg-sent' : 'msg-received')">
                                    <span th:text="${msg.content}"></span>

                                    <div class="msg-meta">
                                        <span th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></span>

                                        <span th:if="${msg.sender.username == #authentication.name}" class="ms-1">
                                            <i th:if="${msg.read}" class="fas fa-check-double tick-read"></i>
                                            <i th:if="${!msg.read}" class="fas fa-check-double tick-delivered"></i>

                                            <form th:if="${!msg.read}" th:action="@{/messages/delete}" method="post" class="d-inline ms-2">
                                                <input type="hidden" name="messageId" th:value="${msg.id}">
                                                <input type="hidden" name="receiver" th:value="${receiverName}">
                                                <button type="submit" class="btn btn-link text-danger p-0" style="font-size: 0.8rem;">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${messages.empty}" class="text-center text-muted mt-5">
                            <i class="far fa-paper-plane fa-3x mb-3 text-secondary"></i>
                            <p>No messages yet. Start the conversation!</p>
                        </div>
                    </div>

                    <div class="card-footer bg-white p-3">
                        <form th:action="@{/messages/send}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="receiver" th:value="${receiverName}">
                            <input type="text" name="content" class="form-control rounded-pill px-4" placeholder="Type your message..." required autocomplete="off">
                            <button type="submit" class="btn btn-safari rounded-circle" style="width: 45px; height: 45px; padding: 0;">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var chatBox = document.querySelector('.chat-box');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>
