<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-paw me-2"></i>SAFARI WILD</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="margin-top: 100px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark"><i class="fas fa-suitcase-rolling me-2"></i>My Adventures</h2>
        <a href="/book" class="btn btn-outline-dark rounded-pill"><i class="fas fa-plus me-1"></i> New Trip</a>
    </div>

    <div th:if="${param.paid}" class="alert alert-success shadow-sm border-0"><i class="fas fa-check me-2"></i>Payment Successful! Your trip is confirmed.</div>
    <div th:if="${param.cancelled}" class="alert alert-warning shadow-sm border-0"><i class="fas fa-times me-2"></i>Booking Cancelled.</div>
    <div th:if="${param.feedbackSuccess}" class="alert alert-info shadow-sm border-0"><i class="fas fa-star me-2"></i>Thank you for your feedback!</div>
    <div th:if="${param.feedbackDeleted}" class="alert alert-secondary shadow-sm border-0">Review deleted.</div>

    <div th:if="${bookings.empty}" class="text-center py-5">
        <i class="fas fa-leaf fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">You haven't booked any trips yet.</h4>
        <a href="/book" class="btn btn-safari mt-3">Find an Adventure</a>
    </div>

    <div th:if="${!bookings.empty}" class="card shadow border-0 overflow-hidden">
        <table class="table table-safari mb-0">
            <thead>
            <tr>
                <th><i class="far fa-calendar-alt me-2"></i>Date</th>
                <th><i class="fas fa-map-signs me-2"></i>Package</th>
                <th>Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.bookingDate}" class="fw-bold"></td>
                <td th:text="${booking.safariPackage.packageName}"></td>
                <td th:text="'$' + ${booking.safariPackage.price}" class="text-success fw-bold"></td>

                <td>
                    <span th:if="${booking.status == 'PENDING'}" class="badge bg-warning text-dark"><i class="fas fa-clock me-1"></i> Pending</span>
                    <span th:if="${booking.status == 'CONFIRMED'}" class="badge bg-success"><i class="fas fa-check-circle me-1"></i> Confirmed</span>
                    <span th:if="${booking.status == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                </td>

                <td>
                    <div class="d-flex gap-2 align-items-center">
                        <div th:if="${booking.status == 'PENDING'}">
                            <a th:href="@{/pay(bookingId=${booking.id})}" class="btn btn-safari btn-sm py-1 px-3">Pay</a>
                            <form th:action="@{/booking/cancel}" method="post" class="d-inline" onsubmit="return confirm('Cancel this trip?');">
                                <input type="hidden" name="bookingId" th:value="${booking.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm py-1 px-3">Cancel</button>
                            </form>
                        </div>

                        <span th:if="${booking.status == 'CONFIRMED'}" class="text-muted small me-2"><i class="fas fa-lock"></i> Paid</span>

                        <a th:if="${booking.status == 'CONFIRMED' and booking.feedback == null}"
                           th:href="@{/feedback/add(bookingId=${booking.id})}"
                           class="btn btn-outline-warning btn-sm text-dark">Rate Trip</a>

                        <div th:if="${booking.feedback != null}" class="d-flex align-items-center gap-2">
                            <span class="text-warning"><i class="fas fa-star"></i> <span th:text="${booking.feedback.rating}"></span></span>
                            <form th:action="@{/feedback/delete}" method="post" onsubmit="return confirm('Delete review?');">
                                <input type="hidden" name="feedbackId" th:value="${booking.feedback.id}">
                                <button type="submit" class="btn btn-link text-danger p-0 small"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
