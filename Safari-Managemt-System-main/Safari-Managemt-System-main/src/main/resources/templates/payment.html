<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Secure Payment Gateway</h4>
                </div>
                <div class="card-body">

                    <div class="alert alert-info">
                        <strong>Package:</strong> <span th:text="${booking.safariPackage.packageName}"></span><br>
                        <strong>Date:</strong> <span th:text="${booking.bookingDate}"></span><br>
                        <hr>
                        <h4 class="text-center">Total: $<span th:text="${booking.safariPackage.price}"></span></h4>
                    </div>

                    <div th:if="${savedCard != null}" class="alert alert-success py-2">
                        <small>✓ Card details auto-filled from your saved profile.</small>
                    </div>

                    <form th:action="@{/process-payment}" method="post">
                        <input type="hidden" name="bookingId" th:value="${booking.id}">
                        <input type="hidden" name="amount" th:value="${booking.safariPackage.price}">

                        <div class="mb-3">
                            <label class="form-label">Cardholder Name</label>
                            <input type="text" name="cardHolder" class="form-control" placeholder="John Doe"
                                   th:value="${savedCard != null} ? ${savedCard.cardHolderName} : ''" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Card Number</label>
                            <input type="text" name="cardNumber" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19"
                                   th:value="${savedCard != null} ? ${savedCard.cardNumber} : ''" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Expiry</label>
                                <input type="text" name="expiry" class="form-control" placeholder="MM/YY" maxlength="5"
                                       th:value="${savedCard != null} ? ${savedCard.expiryDate} : ''" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input type="text" name="cvv" class="form-control" placeholder="123" maxlength="3"
                                       th:value="${savedCard != null} ? ${savedCard.cvv} : ''" required>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="saveCard" id="saveCardCheck">
                            <label class="form-check-label" for="saveCardCheck">
                                Save this card for future bookings
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Pay Now</button>
                        </div>

                        <div class="text-center mt-3">
                            <a href="/my-bookings" class="text-secondary">Cancel Payment</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
