<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-paw me-2"></i>SAFARI WILD</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header card-header-safari text-center py-4">
                    <h3 class="mb-0"><i class="fas fa-user-circle me-2"></i>My Profile</h3>
                </div>
                <div class="card-body p-5">

                    <div th:if="${param.success}" class="alert alert-success text-center border-0 shadow-sm">
                        <i class="fas fa-check-circle me-2"></i>Profile updated successfully!
                    </div>

                    <form th:action="@{/profile/update}" method="post" th:object="${user}">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{username}">

                        <div class="text-center mb-4">
                            <div class="display-1 text-muted"><i class="fas fa-user"></i></div>
                            <h5 class="text-muted" th:text="'@' + *{username}"></h5>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">FIRST NAME</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">LAST NAME</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-safari">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
