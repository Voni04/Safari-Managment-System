# ===============================
# DATABASE CONFIGURATION
# ===============================
# Connection URL: connecting to MySQL on localhost port 3306, database name 'safari_db'
spring.datasource.url=jdbc:mysql://localhost:3306/safari_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database Credentials (CHANGE THESE TO MATCH YOUR MYSQL)
spring.datasource.username=root
spring.datasource.password=#Sinoli19

# Driver Class Name (standard for MySQL 8)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Update the database schema automatically when we change our Java code
# 'update': keeps data and updates structure.
# 'create-drop': deletes data on restart (good for testing, but we use 'update' for now)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (Helpful for debugging)
spring.jpa.show-sql=true

# Format the SQL to make it readable
spring.jpa.properties.hibernate.format_sql=true

# Use MySQL 8 dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
# Disable caching so we can see HTML changes immediately without restarting
spring.thymeleaf.cache=false

# ===============================
# EMAIL CONFIGURATION (GMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sinolipraveesha2003@gmail.com
spring.mail.password=PUT_YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
